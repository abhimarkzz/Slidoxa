# Slidoxa Alembic configuration (NEW database only).
# Isolation rule: this configuration must not import legacy SQLModel
# metadata or share a session factory with
# packages/backend/app/legacy/services/database.py.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
version_path_separator = os
# DATABASE_URL is read from the environment by migrations/env.py.
# sqlalchemy.url is intentionally blank to force environment-driven config.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
